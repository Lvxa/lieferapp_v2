<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lieferapp – Auswertungen</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}.top{background:#111827;color:white;padding:16px;position:sticky;top:0;z-index:10}.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:20px;margin:0}.back{color:#fff;text-decoration:none;background:#374151;padding:9px 12px;border-radius:10px;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 2px 10px #0001}.kpi .n{font-size:27px;font-weight:900}.kpi .l{font-size:12px;color:#6b7280;margin-top:3px}.section{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}.section h2{font-size:18px;margin:0 0 12px}.row{padding:11px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border-bottom:0}.rhead{display:flex;justify-content:space-between;gap:10px;font-weight:850}.sub{font-size:12px;color:#6b7280;margin-top:4px}.pill{display:inline-block;background:#e5e7eb;border-radius:999px;padding:4px 8px;margin:3px 4px 0 0;font-size:11px}.empty{color:#6b7280;padding:14px 0}.refresh,.reset{border:0;color:#fff;padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.refresh{background:#16a34a}.reset{background:#6b7280}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px}.hidden{display:none}.filters{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:12px}.filter label{display:block;font-size:11px;font-weight:800;color:#4b5563;margin-bottom:4px}.filter input,.filter select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px;background:#fff;font-size:14px}.filter-actions{display:flex;align-items:end}.delivery-summary{font-size:12px;color:#6b7280;margin:4px 0 10px}.delivery{border:1px solid #e5e7eb;border-radius:13px;margin:9px 0;overflow:hidden;background:#fff}.delivery summary{list-style:none;cursor:pointer;padding:13px}.delivery summary::-webkit-details-marker{display:none}.delivery[open] summary{background:#f9fafb;border-bottom:1px solid #e5e7eb}.delivery-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.delivery-title{font-weight:900}.delivery-meta{font-size:12px;color:#6b7280;margin-top:4px;line-height:1.5}.delivery-right{text-align:right;font-size:12px;white-space:nowrap}.delivery-right strong{display:block;font-size:14px;color:#111827}.delivery-body{padding:0 13px 13px}.note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:9px 10px;margin:11px 0;font-size:13px}.items{width:100%;border-collapse:collapse;font-size:13px}.items th,.items td{padding:8px 5px;border-bottom:1px solid #e5e7eb;text-align:left}.items th:last-child,.items td:last-child{text-align:right}.items tr:last-child td{border-bottom:0}.badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800;margin-left:5px}.muted{color:#6b7280}.countline{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.countpill{background:#f3f4f6;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}.searchwide{grid-column:1/-1}@media(min-width:760px){.filters{grid-template-columns:repeat(4,1fr)}.searchwide{grid-column:span 2}}@media(min-width:800px){.cards{grid-template-columns:repeat(5,1fr)}}@media(max-width:600px){.delivery-head{display:block}.delivery-right{text-align:left;margin-top:8px;white-space:normal}.topin{align-items:flex-start}.topin>div{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}}
</style>
</head>
<body>
<header class="top"><div class="topin"><h1>📊 Auswertungen 2026</h1><div><button class="refresh" onclick="load()">Aktualisieren</button> <a class="back" href="/">Zur App</a></div></div></header>
<main class="wrap">
<div id="error" class="error hidden"></div>
<div id="cards" class="cards"></div>

<section class="section">
<h2>🧾 Lieferscheine</h2>
<div class="filters">
  <div class="filter"><label>Von</label><input id="filterFrom" type="date" onchange="renderDeliveries()"></div>
  <div class="filter"><label>Bis</label><input id="filterTo" type="date" onchange="renderDeliveries()"></div>
  <div class="filter"><label>Bude</label><select id="filterStand" onchange="renderDeliveries()"><option value="">Alle Buden</option></select></div>
  <div class="filter"><label>Lieferant</label><select id="filterSupplier" onchange="renderDeliveries()"><option value="">Alle Lieferanten</option></select></div>
  <div class="filter searchwide"><label>Suche in Lieferschein, Notiz oder Produkt</label><input id="filterSearch" type="search" placeholder="z. B. Erstbestückung, Cola oder #42" oninput="renderDeliveries()"></div>
  <div class="filter-actions"><button class="reset" onclick="resetDeliveryFilters()">Filter zurücksetzen</button></div>
</div>
<div id="deliverySummary" class="delivery-summary"></div>
<div id="deliveries"></div>
</section>

<section class="section"><h2>Nachbestellungen pro Bude</h2><div id="stands"></div></section>
<section class="section"><h2>Meist nachbestellte Produkte gesamt</h2><div id="topProducts"></div></section>
<section class="section"><h2>Verkäufe über Kassenrechner</h2><div id="sales"></div></section>
</main>
<script>
const token=sessionStorage.getItem('authToken');let user=null,deliveredOrders=[];try{user=JSON.parse(sessionStorage.getItem('currentUser')||'null')}catch{}
const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function call(p){const r=await fetch('/api'+p,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function kpi(n,l){return `<div class="card kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`}
function productPills(arr){return (arr||[]).slice(0,5).map(x=>`<span class="pill">${esc(x.name)}: ${Number(x.quantity)||0}</span>`).join('')||'<span class="sub">Noch keine Daten</span>'}
function deliveryDate(o){return o.stockAppliedAt||o.updatedAt||o.createdAt||null}
function fmtDateTime(ts){if(!ts)return 'Zeitpunkt unbekannt';const d=new Date(ts);return new Intl.DateTimeFormat('de-DE',{dateStyle:'medium',timeStyle:'short'}).format(d)+' Uhr'}
function localDateKey(ts){if(!ts)return '';const d=new Date(ts);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function totals(o){const items=o.items||[];return{positions:items.length,units:items.reduce((s,x)=>s+(Number(x.quantity)||0),0)}}
function fillDeliveryFilters(){const stand=document.getElementById('filterStand'),supplier=document.getElementById('filterSupplier');const stands=[...new Set(deliveredOrders.map(o=>o.standName||o.standort).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));const suppliers=[...new Set(deliveredOrders.map(o=>o.deliveredBy).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));stand.innerHTML='<option value="">Alle Buden</option>'+stands.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');supplier.innerHTML='<option value="">Alle Lieferanten</option>'+suppliers.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function renderDeliveries(){const from=document.getElementById('filterFrom').value,to=document.getElementById('filterTo').value,stand=document.getElementById('filterStand').value,supplier=document.getElementById('filterSupplier').value,q=document.getElementById('filterSearch').value.trim().toLowerCase();let rows=deliveredOrders.filter(o=>{const day=localDateKey(deliveryDate(o));if(from&&day<from)return false;if(to&&day>to)return false;if(stand&&(o.standName||o.standort)!==stand)return false;if(supplier&&(o.deliveredBy||'')!==supplier)return false;if(q){const hay=[`#${o.id}`,o.id,o.standName,o.standort,o.notes,o.createdBy,o.deliveredBy,...(o.items||[]).map(i=>i.productName)].filter(Boolean).join(' ').toLowerCase();if(!hay.includes(q))return false}return true});rows.sort((a,b)=>new Date(deliveryDate(b)||0)-new Date(deliveryDate(a)||0));const sumUnits=rows.reduce((s,o)=>s+totals(o).units,0);document.getElementById('deliverySummary').textContent=`${rows.length} Lieferschein${rows.length===1?'':'e'} · ${sumUnits} Lager-Einheiten in der Auswahl`;document.getElementById('deliveries').innerHTML=rows.length?rows.map(o=>{const t=totals(o),when=fmtDateTime(deliveryDate(o));const items=(o.items||[]).map(i=>`<tr><td>${esc(i.productName||i.productId)}${i.unit?` <span class="muted">(${esc(i.unit)})</span>`:''}</td><td>${Number(i.quantity)||0}</td></tr>`).join('');return `<details class="delivery"><summary><div class="delivery-head"><div><div class="delivery-title">Lieferschein #${esc(o.id)} · ${esc(o.standName||o.standort)} <span class="badge">Ausgeliefert</span></div><div class="delivery-meta">${esc(when)}<br>Ausgeliefert von: <strong>${esc(o.deliveredBy||'—')}</strong>${o.createdBy?` · bestellt/angelegt von: ${esc(o.createdBy)}`:''}</div><div class="countline"><span class="countpill">${t.positions} Position${t.positions===1?'':'en'}</span><span class="countpill">${t.units} Lager-Einheiten</span></div></div><div class="delivery-right"><strong>${t.units} gesamt</strong>${Number(o.total)>0?`Warenwert ${euro(o.total)}`:'Sponsor/ohne Warenwert'}</div></div></summary><div class="delivery-body">${o.notes?`<div class="note"><strong>Notiz:</strong> ${esc(o.notes)}</div>`:''}<table class="items"><thead><tr><th>Produkt</th><th>Menge</th></tr></thead><tbody>${items||'<tr><td colspan="2" class="muted">Keine Positionen gespeichert.</td></tr>'}</tbody></table></div></details>`}).join(''):'<div class="empty">Keine ausgelieferten Lieferscheine für diese Filter gefunden.</div>'}
function resetDeliveryFilters(){for(const id of ['filterFrom','filterTo','filterStand','filterSupplier','filterSearch'])document.getElementById(id).value='';renderDeliveries()}
async function load(){const err=document.getElementById('error');err.classList.add('hidden');if(!token||!user||user.role!=='admin'){err.textContent='Bitte zuerst als Admin in der Haupt-App anmelden.';err.classList.remove('hidden');return}try{const [d,orders]=await Promise.all([call('/analytics/dashboard'),call('/orders/all?status=delivered')]);deliveredOrders=Array.isArray(orders)?orders:[];fillDeliveryFilters();renderDeliveries();document.getElementById('cards').innerHTML=kpi(d.totalProducts,'Produkte')+kpi(d.pendingOrders,'Offene Bestellungen')+kpi(d.deliveredOrders,'Gelieferte Bestellungen')+kpi(euro(d.deliveredValue),'Wert ausgelieferte Ware')+kpi(euro(d.retailSales?.revenue),'Kassen-Umsatz inkl. Pfand');const stands=d.reorderByStand||[];document.getElementById('stands').innerHTML=stands.length?stands.map(s=>`<div class="row"><div class="rhead"><span>${esc(s.standName)}</span><span>${s.orderCount} Lieferungen · ${s.units} Lager-Einheiten</span></div><div class="sub">Ausgelieferter Verkaufswert: ${euro(s.value)}</div><div>${productPills(s.topProducts)}</div></div>`).join(''):'<div class="empty">Noch keine abgeschlossenen Lieferungen.</div>';document.getElementById('topProducts').innerHTML=(d.topReorderedProducts||[]).length?(d.topReorderedProducts||[]).slice(0,15).map((p,i)=>`<div class="row"><div class="rhead"><span>${i+1}. ${esc(p.name)}</span><span>${Number(p.quantity)||0}</span></div></div>`).join(''):'<div class="empty">Noch keine Daten.</div>';const s=d.retailSales||{};const salesStands=s.stands||[];document.getElementById('sales').innerHTML=`<div class="cards">${kpi(euro(s.drinksRevenue),'Getränke-Umsatz')}${kpi(euro(s.depositsNet),'Pfand netto')}${kpi(euro(s.estimatedCost),'geschätzter Wareneinsatz')}${kpi(euro(s.estimatedMargin),'geschätzte Marge')}</div>`+(salesStands.length?salesStands.map(x=>`<div class="row"><div class="rhead"><span>${esc(x.standName)}</span><span>${euro(x.revenue)}</span></div><div class="sub">${x.salesCount} gespeicherte Verkäufe · Getränke ${euro(x.drinksRevenue)} · geschätzte Marge ${euro(x.estimatedMargin)}</div><div>${productPills(x.topProducts)}</div></div>`).join(''):'<div class="empty">Noch keine Kassenverkäufe gespeichert. Einkaufspreise sind aktuell noch leer; Marge wird aussagekräftig, sobald sie eingetragen sind.</div>')}catch(e){err.textContent=e.message;err.classList.remove('hidden')}}
load();
</script>
</body></html>
