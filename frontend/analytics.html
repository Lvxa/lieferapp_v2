<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lieferapp – Auswertungen</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}.top{background:#111827;color:white;padding:16px;position:sticky;top:0;z-index:10}.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:20px;margin:0}.back{color:#fff;text-decoration:none;background:#374151;padding:9px 12px;border-radius:10px;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 2px 10px #0001}.kpi .n{font-size:27px;font-weight:900}.kpi .l{font-size:12px;color:#6b7280;margin-top:3px}.section{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}.section h2{font-size:18px;margin:0 0 12px}.row{padding:11px 0;border-bottom:1px solid #e5e7eb}.row:last-child{border-bottom:0}.rhead{display:flex;justify-content:space-between;gap:10px;font-weight:850}.sub{font-size:12px;color:#6b7280;margin-top:4px}.pill{display:inline-block;background:#e5e7eb;border-radius:999px;padding:4px 8px;margin:3px 4px 0 0;font-size:11px}.empty{color:#6b7280;padding:14px 0}.refresh{border:0;background:#16a34a;color:#fff;padding:10px 13px;border-radius:10px;font-weight:800}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px}.hidden{display:none}@media(min-width:800px){.cards{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="topin"><h1>📊 Auswertungen 2026</h1><div><button class="refresh" onclick="load()">Aktualisieren</button> <a class="back" href="/">Zur App</a></div></div></header>
<main class="wrap"><div id="error" class="error hidden"></div><div id="cards" class="cards"></div><section class="section"><h2>Nachbestellungen pro Bude</h2><div id="stands"></div></section><section class="section"><h2>Meist nachbestellte Produkte gesamt</h2><div id="topProducts"></div></section><section class="section"><h2>Verkäufe über Kassenrechner</h2><div id="sales"></div></section></main>
<script>
const token=sessionStorage.getItem('authToken');let user=null;try{user=JSON.parse(sessionStorage.getItem('currentUser')||'null')}catch{}
const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);
async function call(p){const r=await fetch('/api'+p,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function kpi(n,l){return `<div class="card kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`}
function productPills(arr){return (arr||[]).slice(0,5).map(x=>`<span class="pill">${x.name}: ${x.quantity}</span>`).join('')||'<span class="sub">Noch keine Daten</span>'}
async function load(){const err=document.getElementById('error');err.classList.add('hidden');if(!token||!user||user.role!=='admin'){err.textContent='Bitte zuerst als Admin in der Haupt-App anmelden.';err.classList.remove('hidden');return}try{const d=await call('/analytics/dashboard');document.getElementById('cards').innerHTML=kpi(d.totalProducts,'Produkte')+kpi(d.pendingOrders,'Offene Bestellungen')+kpi(d.deliveredOrders,'Gelieferte Bestellungen')+kpi(euro(d.deliveredValue),'Wert ausgelieferte Ware')+kpi(euro(d.retailSales?.revenue),'Kassen-Umsatz inkl. Pfand');const stands=d.reorderByStand||[];document.getElementById('stands').innerHTML=stands.length?stands.map(s=>`<div class="row"><div class="rhead"><span>${s.standName}</span><span>${s.orderCount} Lieferungen · ${s.units} Lager-Einheiten</span></div><div class="sub">Ausgelieferter Verkaufswert: ${euro(s.value)}</div><div>${productPills(s.topProducts)}</div></div>`).join(''):'<div class="empty">Noch keine abgeschlossenen Lieferungen.</div>';document.getElementById('topProducts').innerHTML=(d.topReorderedProducts||[]).length?(d.topReorderedProducts||[]).slice(0,15).map((p,i)=>`<div class="row"><div class="rhead"><span>${i+1}. ${p.name}</span><span>${p.quantity}</span></div></div>`).join(''):'<div class="empty">Noch keine Daten.</div>';const s=d.retailSales||{};const salesStands=s.stands||[];document.getElementById('sales').innerHTML=`<div class="cards">${kpi(euro(s.drinksRevenue),'Getränke-Umsatz')}${kpi(euro(s.depositsNet),'Pfand netto')}${kpi(euro(s.estimatedCost),'geschätzter Wareneinsatz')}${kpi(euro(s.estimatedMargin),'geschätzte Marge')}</div>`+(salesStands.length?salesStands.map(x=>`<div class="row"><div class="rhead"><span>${x.standName}</span><span>${euro(x.revenue)}</span></div><div class="sub">${x.salesCount} gespeicherte Verkäufe · Getränke ${euro(x.drinksRevenue)} · geschätzte Marge ${euro(x.estimatedMargin)}</div><div>${productPills(x.topProducts)}</div></div>`).join(''):'<div class="empty">Noch keine Kassenverkäufe gespeichert. Einkaufspreise sind aktuell noch leer; Marge wird aussagekräftig, sobald sie eingetragen sind.</div>')}catch(e){err.textContent=e.message;err.classList.remove('hidden')}}
load();
</script>
</body></html>
