<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lieferapp – Preise</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}.top{background:#111827;color:#fff;padding:15px;position:sticky;top:0;z-index:10}.topin{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:20px;margin:0}.back{color:#fff;text-decoration:none;background:#374151;padding:9px 12px;border-radius:10px;font-weight:700}.wrap{max-width:1050px;margin:auto;padding:14px}.info{background:#dbeafe;color:#1e3a8a;padding:12px;border-radius:13px;margin-bottom:12px}.item{background:#fff;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0001}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-weight:900}.sub{font-size:12px;color:#6b7280;margin-top:3px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.field label{font-size:11px;font-weight:800;color:#4b5563;display:block;margin-bottom:4px}.field input{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px;font-size:16px}.save{border:0;background:#16a34a;color:#fff;border-radius:10px;padding:10px 13px;font-weight:850}.margin{margin-top:9px;font-size:12px}.ok{color:#166534}.muted{color:#6b7280}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px}.hidden{display:none}@media(min-width:760px){.fields{grid-template-columns:repeat(5,1fr)}}</style></head><body><header class="top"><div class="topin"><h1>💰 Einkauf & Verkauf</h1><a class="back" href="/">Zur App</a></div></header><main class="wrap"><div class="info">Einkaufspreis = Preis pro Lager-Einheit (Kiste/Fass). Endkundenpreis = Preis pro einzelner Flasche bzw. 0,3-l-Portion. So kann die App Marge und Wareneinsatz sauber berechnen.</div><div id="error" class="error hidden"></div><div id="list"></div></main><script>const token=sessionStorage.getItem('authToken');let user=null,products=[];try{user=JSON.parse(sessionStorage.getItem('currentUser')||'null')}catch{}const euro=n=>n==null?'—':new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);async function call(p,opt={}){const r=await fetch('/api'+p,{...opt,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}function calc(p){const rev=(p.retailPrice!=null&&p.retailUnitsPerStockUnit!=null)?Number(p.retailPrice)*Number(p.retailUnitsPerStockUnit):Number(p.price||0);const margin=p.purchasePrice==null?null:rev-Number(p.purchasePrice);return{rev,margin}}function render(){document.getElementById('list').innerHTML=products.map(p=>{const c=calc(p);return `<div class="item" id="p${p.id}"><div class="head"><div><div class="name">${p.name}</div><div class="sub">${p.unit||''} · ${p.package||''}</div></div><button class="save" onclick="save(${p.id})">Speichern</button></div><div class="fields"><div class="field"><label>Einkauf / ${p.unit||'Einheit'} (€)</label><input id="buy${p.id}" type="number" step="0.01" min="0" value="${p.purchasePrice??''}" placeholder="noch offen"></div><div class="field"><label>Endkunde (€)</label><input id="retail${p.id}" type="number" step="0.01" min="0" value="${p.retailPrice??''}" placeholder="nicht im Verkauf"></div><div class="field"><label>Verkaufseinheiten / ${p.unit||'Einheit'}</label><input id="units${p.id}" type="number" step="0.0001" min="0" value="${p.retailUnitsPerStockUnit??''}"></div><div class="field"><label>Pfand je Verkauf (€)</label><input id="dep${p.id}" type="number" step="0.01" min="0" value="${p.depositPrice??0}"></div><div class="field"><label>Verkaufswert Lager-Einheit</label><input value="${euro(c.rev)}" disabled></div></div><div class="margin ${c.margin==null?'muted':'ok'}">${c.margin==null?'Marge erscheint, sobald ein Einkaufspreis eingetragen ist.':`Theoretische Marge pro ${p.unit||'Einheit'}: ${euro(c.margin)}`}</div></div>`}).join('')}async function save(id){const buy=document.getElementById('buy'+id).value,retail=document.getElementById('retail'+id).value,units=document.getElementById('units'+id).value,dep=document.getElementById('dep'+id).value;try{const updated=await call('/products/'+id,{method:'PATCH',body:JSON.stringify({purchasePrice:buy===''?null:Number(buy),retailPrice:retail===''?null:Number(retail),retailUnitsPerStockUnit:units===''?null:Number(units),depositPrice:Number(dep||0)})});products=products.map(p=>p.id===id?updated:p);render()}catch(e){alert(e.message)}}async function boot(){const e=document.getElementById('error');if(!token||!user||user.role!=='admin'){e.textContent='Bitte zuerst als Admin in der Haupt-App anmelden.';e.classList.remove('hidden');return}try{products=await call('/products');render()}catch(err){e.textContent=err.message;e.classList.remove('hidden')}}boot();</script></body></html>
