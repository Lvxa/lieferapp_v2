<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bierbude – Kassenrechner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}.hidden{display:none!important}.top{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:10px 12px;box-shadow:0 2px 12px #0003}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:18px;margin:0}.who{font-size:11px;color:#d1d5db;margin-top:2px}.logout{border:0;background:#374151;color:#fff;border-radius:9px;padding:8px 11px;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:9px 9px 185px}.login{max-width:420px;margin:10vh auto;background:#fff;padding:22px;border-radius:18px;box-shadow:0 10px 35px #0001}.login h2{margin-top:0}.field{margin:12px 0}.field label{font-weight:700;font-size:13px;display:block;margin-bottom:6px}.field input,.field select{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.primary{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:#111827;color:#fff}.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #d1d5db;background:#fff;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700}.chip.active{background:#111827;color:#fff;border-color:#111827}.stand-admin{background:#fff;padding:8px 10px;border-radius:11px;margin-bottom:8px}.stand-admin select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:9px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.product{min-height:72px;border:0;border-radius:10px;background:#fff;padding:8px 9px;text-align:left;box-shadow:0 1px 5px #0001;position:relative}.product:active{transform:scale(.98)}.product .name{font-weight:850;font-size:12px;line-height:1.08;padding-right:21px}.product .unit{font-size:9px;color:#6b7280;margin-top:2px}.product .price{font-size:15px;font-weight:900;margin-top:4px}.product .pfand{font-size:9px;color:#6b7280;line-height:1.05}.plus{position:absolute;right:6px;top:6px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#111827;color:#fff;font-size:15px;font-weight:900}.cart{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid #e5e7eb;box-shadow:0 -6px 25px #0002;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.cart-inner{max-width:1100px;margin:auto}.cart-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.cart-title{font-weight:900}.total{font-weight:950;font-size:23px}.cart-lines{max-height:120px;overflow:auto;margin:5px 0}.line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #f3f4f6}.line-name{font-size:12px;font-weight:700}.line-sub{font-size:10px;color:#6b7280}.qty{display:flex;align-items:center;gap:5px}.qty button{width:28px;height:28px;border:0;border-radius:8px;background:#e5e7eb;font-size:18px;font-weight:900}.qty strong{min-width:20px;text-align:center}.returns{display:flex;gap:6px;margin:6px 0}.return{flex:1;background:#f3f4f6;border-radius:10px;padding:6px}.return-label{font-size:10px;font-weight:800;margin-bottom:4px}.return-ctrl{display:flex;align-items:center;justify-content:space-between}.return button{border:0;background:#d1d5db;width:28px;height:28px;border-radius:7px;font-size:17px}.actions{display:grid;grid-template-columns:1fr 2fr;gap:6px}.clear,.save{border:0;border-radius:11px;padding:11px;font-size:14px;font-weight:900}.clear{background:#e5e7eb}.save{background:#16a34a;color:#fff}.save:disabled{opacity:.5}.summary{font-size:10px;color:#6b7280;text-align:right;margin-top:1px}.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:10px 14px;border-radius:11px;z-index:100;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.error{background:#b91c1c}@media(min-width:700px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.wrap{padding-bottom:210px}.cart-lines{max-height:145px}}@media(min-width:1000px){.grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="loginView" class="login hidden">
  <h2>🍺 Bierbude anmelden</h2>
  <div class="field"><label>Benutzername</label><input id="username" autocomplete="username"></div>
  <div class="field"><label>Passwort</label><input id="password" type="password" autocomplete="current-password"></div>
  <button class="primary" onclick="login()">Anmelden</button>
</div>
<div id="appView" class="hidden">
  <header class="top"><div class="topline"><div><h1>💶 Kassenrechner</h1><div id="who" class="who"></div></div><button class="logout" onclick="logout()">Abmelden</button></div></header>
  <main class="wrap">
    <div id="adminStandBox" class="stand-admin hidden"><select id="adminStand"></select></div>
    <div id="chips" class="chips"></div>
    <div id="products" class="grid"></div>
  </main>
  <section class="cart">
    <div class="cart-inner">
      <div class="cart-head"><div class="cart-title">Bestellung</div><div id="total" class="total">0,00 €</div></div>
      <div id="summary" class="summary">Getränke 0,00 € · Pfand 0,00 €</div>
      <div id="cartLines" class="cart-lines"></div>
      <div class="returns">
        <div class="return"><div class="return-label">🍾 Flasche zurück (−1 €)</div><div class="return-ctrl"><button onclick="changeReturn('bottle',-1)">−</button><strong id="retBottle">0</strong><button onclick="changeReturn('bottle',1)">+</button></div></div>
        <div class="return"><div class="return-label">🥤 Glas/Becher zurück (−2 €)</div><div class="return-ctrl"><button onclick="changeReturn('glass',-1)">−</button><strong id="retGlass">0</strong><button onclick="changeReturn('glass',1)">+</button></div></div>
      </div>
      <div class="actions"><button class="clear" onclick="clearCart()">Neu</button><button id="saveBtn" class="save" onclick="saveSale()">Verkauf speichern</button></div>
    </div>
  </section>
</div>
<script>
const API='/api';let token=null,user=null,posProducts=[],cart=new Map(),category='Alle',returns={bottle:0,glass:0};
const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);
function toast(msg,type=''){const e=document.getElementById('toast');e.textContent=msg;e.className='toast show '+type;setTimeout(()=>e.className='toast',2600)}
async function call(path,opt={}){const headers={'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})};const r=await fetch(API+path,{...opt,headers:{...headers,...(opt.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
async function login(){try{const data=await call('/auth/login',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});token=data.token;user=data.user;sessionStorage.setItem('authToken',token);sessionStorage.setItem('currentUser',JSON.stringify(user));await start()}catch(e){toast(e.message,'error')}}
function logout(){sessionStorage.clear();token=null;user=null;location.reload()}
async function boot(){token=sessionStorage.getItem('authToken');try{user=JSON.parse(sessionStorage.getItem('currentUser')||'null')}catch{}if(token&&user){try{await call('/auth/me');await start();return}catch{}}document.getElementById('loginView').classList.remove('hidden')}
async function start(){if(!['bierbude','admin'].includes(user.role)){sessionStorage.clear();throw new Error('Kassenrechner ist nur für Bierbuden/Admin verfügbar.')}document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('who').textContent=`${user.username} · ${user.role}`;if(user.role==='admin'){const stands=await call('/stands');const sel=document.getElementById('adminStand');sel.innerHTML='<option value="">Bude auswählen…</option>'+stands.map(s=>`<option value="${s.code}">${s.name}</option>`).join('');document.getElementById('adminStandBox').classList.remove('hidden')}posProducts=await call('/pos/products');renderChips();renderProducts();renderCart()}
function renderChips(){const cats=['Alle',...new Set(posProducts.map(p=>p.category))];document.getElementById('chips').innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" onclick="setCategory('${c.replaceAll("'","\\'")}')">${c}</button>`).join('')}
function setCategory(c){category=c;renderChips();renderProducts()}
function renderProducts(){const list=category==='Alle'?posProducts:posProducts.filter(p=>p.category===category);document.getElementById('products').innerHTML=list.map(p=>`<button class="product" onclick="add(${p.id})"><span class="plus">+</span><div class="name">${p.name}</div><div class="unit">${p.retailUnit||''}</div><div class="price">${euro(p.retailPrice)}</div><div class="pfand">+ ${euro(p.depositPrice)} Pfand ${['glass','glas','cup'].includes(String(p.depositType||'').toLowerCase())?'Glas/Becher':'Flasche'}</div></button>`).join('')}
function add(id){cart.set(id,(cart.get(id)||0)+1);renderCart()}
function changeQty(id,d){const n=(cart.get(id)||0)+d;if(n<=0)cart.delete(id);else cart.set(id,n);renderCart()}
function changeReturn(type,d){returns[type]=Math.max(0,returns[type]+d);renderCart()}
function totals(){let drinks=0,deposit=0;for(const [id,q] of cart){const p=posProducts.find(x=>x.id===id);if(!p)continue;drinks+=q*Number(p.retailPrice||0);deposit+=q*Number(p.depositPrice||0)}const returned=returns.bottle*1+returns.glass*2;return{drinks,deposit,returned,total:drinks+deposit-returned}}
function renderCart(){const lines=[...cart.entries()].map(([id,q])=>{const p=posProducts.find(x=>x.id===id);return `<div class="line"><div><div class="line-name">${p.name}</div><div class="line-sub">${euro(p.retailPrice)} + ${euro(p.depositPrice)} Pfand</div></div><div class="qty"><button onclick="changeQty(${id},-1)">−</button><strong>${q}</strong><button onclick="changeQty(${id},1)">+</button></div></div>`}).join('');document.getElementById('cartLines').innerHTML=lines;document.getElementById('retBottle').textContent=returns.bottle;document.getElementById('retGlass').textContent=returns.glass;const t=totals();document.getElementById('total').textContent=euro(t.total);document.getElementById('summary').textContent=`Getränke ${euro(t.drinks)} · Pfand +${euro(t.deposit)} · Rückgabe −${euro(t.returned)}`;document.getElementById('saveBtn').disabled=(cart.size===0&&returns.bottle===0&&returns.glass===0)}
function clearCart(){cart.clear();returns={bottle:0,glass:0};renderCart()}
async function saveSale(){
  const onlyReturns=cart.size===0&&(returns.bottle>0||returns.glass>0);
  if(!cart.size&&!onlyReturns)return;
  const body={depositReturns:{bottle:returns.bottle,glass:returns.glass}};
  if(user.role==='admin'){const s=document.getElementById('adminStand').value;if(!s){toast('Bitte zuerst eine Bude auswählen.','error');return}body.standort=s}
  try{
    let sale;
    if(onlyReturns){sale=await call('/sales/deposit-return',{method:'POST',body:JSON.stringify(body)})}
    else{body.items=[...cart.entries()].map(([posProductId,quantity])=>({posProductId,quantity}));sale=await call('/sales',{method:'POST',body:JSON.stringify(body)})}
    toast(`${onlyReturns?'Pfandrückgabe':'Verkauf'} #${sale.id} · ${euro(sale.total)}`);clearCart()
  }catch(e){toast(e.message,'error')}
}
boot();
</script>
</body>
</html>
